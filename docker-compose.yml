version: '3.8'

services:
  db:
    image: mariadb:latest
    container_name: reservas_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: reservas_db
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: reservas_phpmyadmin
    restart: always
    ports:
      - "8080:80"  # Acceso a PHPMyAdmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: rootpassword

  web:
    build: .
    container_name: reservas_web
    restart: always
    ports:
      - "8000:80"  # Acceso a la API
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
    depends_on:
      - db

volumes:
  db_data: